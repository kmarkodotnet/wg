name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A determinizmus a projekt legfontosabb invariansa, ezert a teszteknek
  # TOBB PLATFORMON es TOBB ARCHITEKTURAN kell futniuk. Egyetlen elteres
  # azt jelenti, hogy a seedek nem hordozhatok.
  test:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c ${{ matrix.config }}

      - name: Test
        run: dotnet test --no-build -c ${{ matrix.config }} --verbosity normal

  # ND-20: a Burst alapbol FloatMode.Default-tal fordit, ami atrendezheti a
  # lebegopontos muveleteket -> csendes I1-sertes. A kapu SZANDEKOSAN elore
  # keszult el, mielott az elso [BurstCompile] megjelenne: igy a bevezeto
  # commit-tal EGYUTT valt pirosra, nem utolag. A --self-test azert kell, hogy
  # az ures halmazon zold kapu ne legyen "vakon zold".
  burst-strict:
    name: Burst FloatMode.Strict kapu (ND-20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A kapu onellenorzese (fixture-ok)
        run: python tools/ci/check_burst_strict.py --self-test
      - name: A repo atvizsgalasa
        run: python tools/ci/check_burst_strict.py --verbose

  # A Python referencia az "orakulum". Ha ez elter a hivatalos Random123
  # vektoroktol, a teljes tesztvektor-keszlet ervenytelen.
  reference-oracle:
    name: Referencia-orakulum verifikalasa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hivatalos KAT vektorok ellenorzese
        working-directory: tools/reference
        run: python verify_kat.py
      - name: Tesztvektorok ujragenaralasa es osszehasonlitasa
        working-directory: tools/reference
        run: |
          python gen_vectors.py
          diff testvectors.json ../../tests/WorldGen.Core.Tests/testdata/testvectors.json \
            && echo "A tesztvektorok reprodukalhatok" \
            || (echo "ELTERES: a tesztvektorok nem reprodukalhatok a referenciabol" && exit 1)
      - name: Lemez-keretes zaj es deep-time oracle (ND-136)
        working-directory: tools/reference
        run: |
          python plate_frame_noise_ref.py
          diff plate_frame_noise_vectors.json ../../tests/WorldGen.Core.Tests/testdata/plate_frame_noise_vectors.json
          python erosion_glaciation_deep_time_ref.py
          diff erosion_glaciation_deep_time_vectors.json ../../tests/WorldGen.Core.Tests/testdata/erosion_glaciation_deep_time_vectors.json
      - name: Ho-visszacsatolas es checkpoint oracle (ND-142/143)
        working-directory: tools/reference
        run: |
          python verify_thermal_feedback.py --check ../../tests/WorldGen.Core.Tests/testdata/thermal_feedback_vectors.json
          python thermal_checkpoint_ref.py
          diff thermal_checkpoint_vectors.json ../../tests/WorldGen.Core.Tests/testdata/thermal_checkpoint_vectors.json
      - name: Eves meridionalis merleg oracle (ND-168)
        working-directory: tools/reference
        run: |
          python meridional_energy_balance_ref.py --verify-kat
          python meridional_energy_balance_ref.py
          git diff --exit-code -- ../../tests/WorldGen.Core.Tests/testdata/meridional_energy_balance_vectors.json
      - name: Eves hostatisztika es ketmenetes jegmaszk oracle (ND-158)
        working-directory: tools/reference
        run: |
          python thermal_annual_ref.py
          diff thermal_annual_vectors.json ../../tests/WorldGen.Core.Tests/testdata/thermal_annual_vectors.json
      - name: Hoolvadasi referencia es KAT (ND-172)
        working-directory: tools/reference
        run: |
          python snow_melt_ref.py
          diff snow_melt_vectors.json ../../tests/WorldGen.Core.Tests/testdata/snow_melt_vectors.json
          python thermal_melt_exposure_ref.py
          diff thermal_melt_exposure_vectors.json ../../tests/WorldGen.Core.Tests/testdata/thermal_melt_exposure_vectors.json
      - name: Szezonalis energiamerleg es fizikai jeg oracle (ND-174/175)
        working-directory: tools/reference
        run: |
          for name in periodic_heat_balance seasonal_energy_balance physical_ice_budget seasonal_coupled; do
            python "${name}_ref.py"
            diff "${name}_vectors.json" "../../tests/WorldGen.Core.Tests/testdata/${name}_vectors.json"
          done
      - name: Folytonos folyo-nyomkoveto v2 oracle (ND-186)
        working-directory: tools/reference
        run: |
          python river_continuous_ref.py
          diff river_continuous_vectors.json ../../tests/WorldGen.Core.Tests/testdata/river_continuous_vectors.json
      - name: Analitikus bolygoalbedo es fogyasztoi oracle (ND-165)
        working-directory: tools/reference
        run: |
          for name in temperature wind_precipitation moisture_transport lakes_ice_erosion regolith; do
            python "${name}_ref.py"
            diff "${name}_vectors.json" "../../tests/WorldGen.Core.Tests/testdata/${name}_vectors.json"
          done
          diff temperature_full_vectors.json ../../tests/WorldGen.Core.Tests/testdata/temperature_full_vectors.json
